<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Flashcards</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style id="css">
:root{--acc-t:#eef0f1;--on-acc:#111314;--green:#97b534;--green-t:#b2cf52;--yellow:#cea813;--yellow-t:#e3bf2c;--blue:#2a5892;--blue-t:#86aee6;--bg:#101112;--panel:#1c1e1f;--panel2:#252829;--line:#33373a;--line2:#454a4e;--text:#f1f3f4;--muted:#9ea4a9;--acc:#eef0f1;--accbg:rgba(255,255,255,.08);--good:#3ccf8a;--goodbg:rgba(60,207,138,.12);--bad:#ff6b6b;--badbg:rgba(255,107,107,.12);--warn:#f4b740;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
::selection{background:rgba(65,209,193,.35)}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(16,17,18,.92);backdrop-filter:blur(10px);z-index:30;min-height:62px}
.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.brand i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#2a9d91);display:inline-block}
.brand.sm{font-size:15px;font-weight:700;color:var(--muted)}
.sp{flex:1}
.wrap{max-width:940px;margin:0 auto;padding:30px 22px 140px}
.wrap.narrow{max-width:780px}
h1{font-size:32px;margin:0 0 6px;font-weight:900;letter-spacing:-.4px}
h2{font-size:20px;margin:0 0 16px;font-weight:800}
h3{font-size:19px;margin:0 0 12px;font-weight:800}
.muted{color:var(--muted)} .sm{font-size:14px} .xs{font-size:12.5px}
.btn{padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;background:var(--panel2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#2c3032}
.btn.primary{background:var(--acc);color:var(--on-acc);border-color:var(--acc-t)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.big{padding:14px 30px;font-size:16px}
.icon{min-width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;color:var(--muted);transition:.15s}
.icon:hover{background:var(--panel2);color:var(--text)}
.icon.on{color:var(--acc-t);background:var(--accbg)}
.icon.sm{min-width:30px;height:30px;font-size:14px}
.link{color:var(--acc-t);font-weight:800;font-size:14px}
.link:hover{text-decoration:underline}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.center{text-align:center}
#status .chip{font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
#status .chip.warn{color:var(--warn);border-color:rgba(244,183,64,.4);cursor:pointer}
#status .chip.ok{color:var(--good);border-color:rgba(60,207,138,.35)}
/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--acc-t);transform:translateY(-2px)}
.tile-t{font-weight:800;font-size:17px;line-height:1.3}
.pbar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--good);border-radius:9px}
.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);padding:40px;text-align:center}
.note{margin-top:34px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.note ul{margin:8px 0 0;padding-left:20px;color:var(--muted);line-height:1.7;font-size:14px}
/* set page */
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px;transition:.15s}
.mode:hover{border-color:var(--acc-t);background:#202324}
.mode svg{width:26px;height:26px;color:var(--acc-t);flex:none}
.opts-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14px;font-weight:700}
select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px;outline:none}
.tog{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.tog input{display:none}
.tog span{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.tog span:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span:after{left:19px}
.lprog{margin:4px 0 22px}
.seg{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;display:flex}
.seg i{display:block;height:100%;transition:width .4s}
.seg i.g{background:var(--good)} .seg i.t{background:var(--acc);opacity:.6}
.lg{display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.g{background:var(--good)} .dot.t{background:var(--acc);opacity:.6} .dot.n{background:var(--line2)}
.terms{display:flex;flex-direction:column;gap:10px}
.term{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 14px 18px}
.term .tt{font-weight:700;border-right:1px solid var(--line);padding-right:16px;white-space:pre-wrap}
.term .td{white-space:pre-wrap;color:#dfe3e5}
.starb svg{width:20px;height:20px}
.starb.on{color:var(--warn)}
/* editor */
.fld{position:relative;display:flex;flex-direction:column-reverse;gap:6px;flex:1}
.fld label{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted)}
.fld input,.fld textarea{background:transparent;border:0;border-bottom:2px solid var(--line2);padding:8px 2px;outline:none;font-size:16px;resize:none;overflow:hidden;line-height:1.4;width:100%}
.fld input:focus,.fld textarea:focus{border-bottom-color:var(--acc-t)}
.fld input:focus+label,.fld textarea:focus+label{color:var(--acc-t)}
.fld.big input{font-size:22px;font-weight:800}
.fld.inline{flex:0 0 190px}
.fld.inline input{font-size:15px;letter-spacing:2px}
.ehead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.ed-tools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 12px}
.sticky-acc{position:sticky;top:62px;z-index:10;background:var(--bg);padding:8px 0}
.erow{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.erow:focus-within{border-color:#3c4245}
.erow-h{display:flex;align-items:center;gap:4px;padding:8px 10px 0 18px;color:var(--muted);font-weight:800}
.erow-b{display:flex;gap:28px;padding:6px 18px 18px}
.addrow{width:100%;padding:22px;border-radius:16px;background:var(--panel);border:1px dashed var(--line2);font-weight:900;letter-spacing:1px;color:var(--muted);transition:.15s}
.addrow:hover{color:var(--acc-t);border-color:var(--acc-t)}
.ed-foot{display:flex;justify-content:flex-end;margin-top:20px}
.paste{background:var(--panel);border:1px solid var(--acc);border-radius:16px;padding:18px;margin-bottom:14px}
.paste textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;outline:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px;font-size:14px}
.pgrid .lbl{font-weight:800;margin-bottom:6px}
.pgrid label{display:flex;align-items:center;gap:7px;margin:4px 0;cursor:pointer}
.pgrid input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;width:90px}
.pgrid input[type=radio]{accent-color:var(--acc-t)}
/* accent bar */
.accbar{display:flex;flex-wrap:wrap;gap:8px}
.acc-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:16px;font-weight:700;transition:.12s;background:var(--bg)}
.acc-btn:hover{border-color:var(--acc-t);color:var(--acc-t)}
.acc-btn:active{transform:scale(.92)}
.acc-btn.shift{color:var(--muted)}
.acc-btn.shift.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc-t)}
/* study */
.st-mode{font-weight:900;font-size:17px}
.st-sub{font-weight:700;font-size:14px;margin-left:6px}
.st-title{font-weight:700;font-size:14px;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-bar{height:4px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-bottom:18px}
.fc-bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.flash{perspective:1800px;height:min(54vh,430px);cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.75,.3,1);transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateX(180deg)}
.flash.noanim .inner{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:50px 40px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.face.back{transform:rotateX(180deg)}
.face .side{position:absolute;top:18px;left:22px;font-size:13px;color:var(--muted);font-weight:800}
.face .starb{position:absolute;top:10px;right:12px}
.ftxt{font-size:32px;font-weight:700;line-height:1.35;white-space:pre-wrap;max-height:100%;overflow:auto}
.ftxt.sm{font-size:23px} .ftxt.xs{font-size:17px}
.fc-ctrl{display:flex;align-items:center;gap:12px;margin-top:20px}
.circ{width:58px;height:46px;border-radius:999px;border:1px solid var(--line2);font-size:20px;display:grid;place-items:center;transition:.15s}
.circ:hover{border-color:var(--acc-t);color:var(--acc-t)}
.trk{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-weight:800;border:1px solid var(--line2);transition:.15s}
.trk .cnt{min-width:30px;height:26px;padding:0 8px;border-radius:99px;display:grid;place-items:center;font-size:13px}
.trk.no{color:#ffa1a1}.trk.no .cnt{background:var(--badbg);color:var(--bad)}
.trk.yes{color:#8fe7bd}.trk.yes .cnt{background:var(--goodbg);color:var(--good)}
.trk.no:hover{border-color:var(--bad)}.trk.yes:hover{border-color:var(--good)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 30px;margin-bottom:18px}
.qlabel{font-size:13px;font-weight:800;color:var(--muted)}
.qtext{font-size:26px;font-weight:700;margin:14px 0 40px;white-space:pre-wrap;line-height:1.35}
.qtext.sm{font-size:21px;margin-bottom:28px}.qtext.xs{font-size:17px;margin:8px 0 16px}
.qsub{font-weight:800;font-size:15px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--line);font-weight:700;font-size:16px;transition:.12s;white-space:pre-wrap;line-height:1.3}
.opt:hover:not([disabled]){border-color:var(--line2);background:#222527}
.opt .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--acc-t);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.45}
.ans{width:100%;margin-top:14px;background:transparent;border:1.5px solid var(--acc);border-radius:16px;padding:20px 18px;font-size:17px;font-weight:600;outline:none}
.ans:focus{box-shadow:0 0 0 4px var(--accbg)}
.ans[disabled]{border-color:var(--line2);opacity:.85}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:16px}
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;border:1px solid}
.fb.ok{background:var(--goodbg);border-color:rgba(60,207,138,.4)}
.fb.no{background:var(--badbg);border-color:rgba(255,107,107,.4)}
.fb.warn{background:rgba(244,183,64,.1);border-color:rgba(244,183,64,.4)}
.fb-t{font-weight:900;font-size:16px}
.fb.ok .fb-t{color:var(--good)}.fb.no .fb-t{color:var(--bad)}.fb.warn .fb-t{color:var(--warn)}
.fb-row{margin-top:12px}
.fb-row .l{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.fb-row .v{font-size:17px;font-weight:700;white-space:pre-wrap}
mark{background:none;color:inherit;border-radius:4px;padding:0 1px}
mark.bad{background:rgba(255,107,107,.3);color:#ffd0d0;text-decoration:line-through;text-decoration-thickness:2px}
mark.miss{background:rgba(60,207,138,.3);color:#c9ffe5;text-decoration:underline}
.fbfoot{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.rlist{text-align:left;margin:18px 0 24px;display:flex;flex-direction:column;gap:8px}
.rr{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--panel2)}
.rr .mk{font-weight:900;width:20px}
.rr.ok .mk{color:var(--good)}.rr.no .mk{color:var(--bad)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-weight:700}
.srow input[type=number]{width:80px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:800;outline:none}
.tf-shown{background:var(--panel2);border-radius:14px;padding:12px 16px;margin:-20px 0 16px}
.tq.res-ok{border-color:rgba(60,207,138,.5)}.tq.res-no{border-color:rgba(255,107,107,.5)}
.tag{font-size:11px;font-weight:900;letter-spacing:.6px;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.ok{background:var(--goodbg);color:var(--good)}.tag.no{background:var(--badbg);color:var(--bad)}
.score{display:flex;align-items:center;gap:26px}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring b{width:86px;height:86px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:24px;font-weight:900}
.fixed-acc{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(28,30,31,.96);border:1px solid var(--line);border-radius:999px;padding:8px 10px;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mtile{min-height:120px;padding:14px;border-radius:16px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:15px;line-height:1.3;transition:border-color .12s,background .12s,opacity .3s,transform .3s;white-space:pre-wrap;word-break:break-word}
.mtile:hover{border-color:var(--line2)}
.mtile.sel{border-color:var(--acc-t);background:var(--accbg)}
.mtile.ok{border-color:var(--good);background:var(--goodbg)}
.mtile.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.mtile.gone{opacity:0;transform:scale(.9);pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#clock{font-variant-numeric:tabular-nums}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:100;padding:20px;animation:fade .15s}
.mdl{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(520px,100%);max-height:88vh;overflow:auto}
.mdl .srow:last-of-type{border-bottom:0}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.mopt{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.mopt .tog{margin-top:2px}
.mopt b{display:block;margin-bottom:2px}
textarea.code{width:100%;height:240px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;outline:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2b2f31;border:1px solid var(--line2);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
/* SAT dark mode */
body.sat-on.sat-dark{background:#14161b}
.sat.dark{--sblue:#5b7cfa;--sblue-bg:rgba(91,124,250,.16);--sline:#363b47;--sgreen:#4cc38a;--sgreenbg:rgba(76,195,138,.14);--sred:#ff7b72;--sredbg:rgba(255,123,114,.14);--sink:#e6e8ec;--smuted:#9aa1ad}
.sat.dark .sh,.sat.dark .sf,.sat.dark .smod,.sat.dark .sres-card,.sat.dark .sexp{background:#1c1f26}
.sat.dark .sopt,.sat.dark .sbtn,.sat.dark .scell,.sat.dark .selim,.sat.dark .sabc,.sat.dark .sl{background:#1f232b}
.sat.dark .sopt{border-color:#3a404d}.sat.dark .sopt:hover:not([disabled]){border-color:#6c7486}
.sat.dark .sopt.sel{background:var(--sblue-bg)}.sat.dark .sopt.right{background:var(--sgreenbg)}.sat.dark .sopt.wrong{background:var(--sredbg)}
.sat.dark .sopt.sel .sl{background:var(--sblue)}.sat.dark .sopt.right .sl{background:var(--sgreen);color:#0c1f14}.sat.dark .sopt.wrong .sl{background:var(--sred);color:#2a0b08}
.sat.dark .sl{border-color:#c9ced8}
.sat.dark .sopt.out .sl{border-color:#5d6472;color:#5d6472}.sat.dark .sopt.out .stx{color:#6b7280}
.sat.dark .sqn,.sat.dark .snav{background:#e6e8ec;color:#14161b!important}
.sat.dark .sprog{background:#2a2e37}
.sat.dark .slink,.sat.dark .smark,.sat.dark .selim,.sat.dark .slegend,.sat.dark .smod-f,.sat.dark .skeys,.sat.dark .sp-text{color:#c3c8d2!important}
.sat.dark .slink:hover{background:#262a33}
.sat.dark .schip{background:#232731;border-color:var(--sline)}
.sat.dark .sbtn-p[disabled]{background:#34406b;color:#8d97b8!important}
.sat.dark .sres-ring b{background:#1c1f26}
.sat.dark .scell.ans{background:var(--sblue-bg)}.sat.dark .scell.ok{background:var(--sgreenbg)}.sat.dark .scell.no{background:var(--sredbg)}
.sat.dark .smark.on svg{fill:#f0b400;color:#f0b400}

.auth-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px 28px}
.atabs{display:flex;background:var(--panel2);border-radius:999px;padding:4px;margin:22px 0 20px}
.atab{flex:1;padding:9px;border-radius:999px;font-weight:800;color:var(--muted);transition:.15s}
.atab.on{background:var(--acc);color:var(--on-acc)}
.afld{margin-bottom:14px}
.afld label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
.afld input{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.afld input:focus{border-color:var(--acc-t)}
.pw{position:relative}.pw input{padding-right:64px}.pw .link{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.aerr{color:var(--bad);font-weight:700;font-size:14px;min-height:20px;margin-bottom:10px}
.uchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:14px;transition:.15s}
.uchip:hover{border-color:var(--acc-t)}
.uchip .av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:900}
@media(max-width:720px){
 .modes{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(3,1fr)}

 .pgrid{grid-template-columns:1fr}.qcard{padding:22px 18px}.ftxt{font-size:25px}.top{padding:10px 14px}.wrap{padding:22px 14px 140px}.st-title{display:none}

/* ---------- smart grading ---------- */
var ARTICLES=['el','la','los','las','lo','un','una','unos','unas','the','a','an','to','le','les','l\'','der','die','das'];
function fold(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function clean(s,cs){s=String(s).normalize('NFC');if(!cs)s=s.toLowerCase();return s.replace(/[¡!¿?.,;:"“”‘’«»…*_]/g,' ').replace(/[‐-―]/g,'-').replace(/\s+/g,' ').trim()}
function stripArt(s){var w=s.split(' ');if(w.length>1&&ARTICLES.indexOf(w[0])>=0)return w.slice(1).join(' ');if(/^l'/.test(s))return s.slice(2);return s}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var p=[],q;for(var j=0;j<=n;j++)p[j]=j;for(var i=1;i<=m;i++){q=[i];for(j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
function variants(raw){var a=raw.replace(/\s*\([^)]*\)\s*/g,' ').trim(),b=raw.replace(/[()]/g,'').trim();return a===b?[raw.trim()]:[a,b]}
function candidates(raw,p){var out=[],seen={};function add(x){x=x.trim();var c=clean(x,p.caseSensitive);if(c&&!seen[c]){seen[c]=1;out.push({raw:x,c:c})}}
 variants(raw).forEach(function(v){add(v);var parts=v.split(p.anyPart?/\s*(?:\/|;|,|\bor\b)\s*/i:/\s*\/\s*/);if(parts.length>1&&(p.anyPart||parts.every(function(x){return clean(x,p.caseSensitive)===clean(parts[0],p.caseSensitive)})))parts.forEach(add)});
 return out}
function cmp(u,c,p){
 if(u===c)return{rank:0,ok:true,kind:'exact'};
 var fu=fold(u),fc=fold(c);
 var ua=stripArt(u),ca=stripArt(c);
 if(ua&&ca&&(ua!==u||ca!==c)){
  if(ua===ca)return p.ignoreArticles?{rank:1,ok:true,kind:'article',note:'Correct — article ignored'}:{rank:5,ok:false,kind:'article',note:'Almost — check the article'};
  if(fold(ua)===fold(ca)&&p.ignoreArticles)return p.strictAccents?{rank:4,ok:false,kind:'accent',note:'Accent mistake'}:{rank:2,ok:true,kind:'accent',note:'Correct — but watch the accents'};
 }
 if(fu===fc)return p.strictAccents?{rank:2.5,ok:false,kind:'accent',note:'So close — accent mistake'}:{rank:2,ok:true,kind:'accent',note:'Correct — but watch the accents'};
 var L=fc.length,tol=L<=3?0:L<=7?1:2;
 if(p.typos&&tol){var df=lev(fu,fc);if(df<=tol){if(p.strictAccents&&lev(u,c)>df)return{rank:4,ok:false,kind:'accent',note:'Check the spelling and accents'};return{rank:3,ok:true,kind:'typo',note:'Correct — small typo'}}}
 if(u.length>=3&&(c.indexOf(u)>=0)&&u.length>=c.length*0.4)return{rank:6,ok:false,kind:'partial',note:'Incomplete answer'};
 return{rank:9,ok:false,kind:'wrong'};
}
function grade(user,answer,p){
 p=p||P();var u=clean(user,p.caseSensitive);
 if(!u)return{ok:false,kind:'blank',target:answer,full:answer};
 var cs=candidates(answer,p),best={rank:99,ok:false,kind:'wrong'};
 cs.forEach(function(c){var r=cmp(u,c.c,p);if(r.rank<best.rank){best=r;best.target=c.raw}});
 // all parts given, any order ("francesa / francés")
 if(best.rank>0){var up=String(user).split(/\s*(?:\/|;|,)\s*/).map(function(x){return clean(x,p.caseSensitive)}).filter(Boolean);
  if(up.length>1){var set=cs.map(function(c){return c.c});if(up.every(function(x){return set.indexOf(x)>=0}))best={rank:0,ok:true,kind:'exact',target:answer}}}
 if(!best.target)best.target=cs.length?cs[0].raw:answer;
 best.full=answer;return best;
}
function diffHTML(a,b,cs){ // a=user, b=target -> [userHTML,targetHTML]
 if(a.length>220||b.length>220)return[esc(a),esc(b)];
 var eq=function(x,y){return cs?x===y:x.toLowerCase()===y.toLowerCase()};
 var m=a.length,n=b.length,D=[],i,j;
 for(i=0;i<=m;i++){D[i]=[];for(j=0;j<=n;j++)D[i][j]=i===0?j:j===0?i:0}
 for(i=1;i<=m;i++)for(j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(eq(a[i-1],b[j-1])?0:1));
 var ua=[],tb=[];i=m;j=n;
 while(i>0||j>0){
  if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(eq(a[i-1],b[j-1])?0:1)){var same=eq(a[i-1],b[j-1]);ua.unshift(same?esc(a[i-1]):'<mark class="bad">'+esc(a[i-1])+'</mark>');tb.unshift(same?esc(b[j-1]):'<mark class="miss">'+esc(b[j-1])+'</mark>');i--;j--}
  else if(i>0&&D[i][j]===D[i-1][j]+1){ua.unshift('<mark class="bad">'+esc(a[i-1])+'</mark>');i--}
  else{tb.unshift('<mark class="miss">'+esc(b[j-1])+'</mark>');j--}
 }
 return[ua.join('').replace(/<\/mark><mark class="bad">/g,''),tb.join('').replace(/<\/mark><mark class="miss">/g,'')];
}
var PRAISE=['Nice work!','Great job!','Correct!','You got it!','Awesome!','Perfect!'];
function fbHTML(g,user){
 var p=P(),cls=g.ok?(g.kind==='exact'?'ok':'warn'):'no';
 var title=g.ok?(g.kind==='exact'?PRAISE[Math.random()*PRAISE.length|0]:g.note):(g.kind==='blank'?'No worries — here\'s the answer':(g.note||'Not quite — you\'re still learning!'));
 var h='<div class="fb '+cls+'"><div class="fb-t">'+esc(title)+'</div>';
 if(g.kind==='blank'){h+='<div class="fb-row"><div class="l">Correct answer</div><div class="v">'+esc(g.full)+'</div></div>'}
 else if(!(g.ok&&g.kind==='exact')){var d=diffHTML(String(user).trim(),g.target,p.caseSensitive);
  h+='<div class="fb-row"><div class="l">Your answer</div><div class="v">'+d[0]+'</div></div><div class="fb-row"><div class="l">Correct answer</div><div class="v">'+d[1]+'</div></div>';
  if(g.target.trim()!==String(g.full).trim())h+='<div class="fb-row"><div class="l">Full answer</div><div class="v">'+esc(g.full)+'</div></div>';}

}
function qa(c,dir){var d=dir==='both'?(Math.random()<.5?'def':'term'):dir;return d==='term'?{q:c.d,a:c.t,qLabel:'Definition',aLabel:'Term',side:'t'}:{q:c.t,a:c.d,qLabel:'Term',aLabel:'Definition',side:'d'}}
function mcOpts(c,q,pool){var others=[],seen={};seen[q.a]=1;shuffle(pool).forEach(function(x){var v=x[q.side];if(x.id!==c.id&&v&&!seen[v]&&others.length<3){seen[v]=1;others.push(v)}});return shuffle(others.concat([q.a]))}

  round=shuffle(shuffle(rem).sort(function(a,b){return lv(b)-lv(a)}).slice(0,7));ri=0;results=[];nextQ()}

  var body=cur.type==='mc'
   ?'<div class="qsub">Choose the matching '+q.aLabel.toLowerCase()+'</div><div class="opts">'+cur.opts.map(function(o,k){return '<button class="opt" data-a="pick" data-k="'+k+'"><span class="num">'+(k+1)+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div><div class="qfoot"><div class="sp"></div><button class="link" data-a="dk">Don\'t know?</button></div>'

  app.innerHTML=studyTop(s,'Learn','Round '+roundNo+' · '+(ri+1)+'/'+round.length,true)+'<main class="wrap narrow">'+progHTML()+'<div class="qcard"><div class="qlabel">'+q.qLabel+'</div><div class="qtext '+sizeCls(q.q)+'">'+esc(q.q)+'</div>'+body+'<div id="fb"></div></div></main>';

 function answered(ok,g,user){

  else h='<div class="fb '+(ok?'ok':'no')+'"><div class="fb-t">'+(ok?PRAISE[Math.random()*PRAISE.length|0]:(g==='dk'?'No worries — here\'s the answer':'Not quite — you\'re still learning!'))+'</div></div>';
  h+='<div class="fbfoot"><span class="muted xs">Press any key to continue</span><div class="sp"></div>'+(!ok&&cur.type==='w'&&g.kind!=='blank'?'<button class="btn sm ghost" data-a="override">Override: I was correct</button>':'')+'<button class="btn primary" data-a="cont">Continue</button></div>';
  $('#fb').innerHTML=h;

 }
 function cont(){clearTimeout(autoT);ri++;nextQ()}
 function pick(k){if(state!=='q')return;var chosen=cur.opts[k],ok=chosen===cur.q.a;
  $$('.opt').forEach(function(b,j){b.disabled=true;var o=cur.opts[j];if(o===cur.q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');else b.classList.add('dim')});
  $('.qfoot').style.display='none';answered(ok,k<0?'dk':null)}

 function drawRoundEnd(){state='end';var good=results.filter(function(r){return r.ok}).length;
  app.innerHTML=studyTop(s,'Learn','Round '+roundNo,true)+'<main class="wrap narrow"><div class="qcard center"><h2>Round '+roundNo+' complete — '+good+'/'+results.length+' correct</h2>'+progHTML()+'<div class="rlist">'+results.map(function(r){return '<div class="rr '+(r.ok?'ok':'no')+'"><span class="mk">'+(r.ok?'✓':'✕')+'</span><div><b>'+esc(r.c.t)+'</b><div class="muted sm">'+esc(r.c.d)+'</div></div></div>'}).join('')+'</div><button class="btn primary big" data-a="next">Continue</button><p class="muted xs">Press Enter to continue</p></div></main>';readyAt=Date.now()+300}

 A.close=function(){go('set-'+s.id)};A.test=function(){go('test-'+s.id)};
 A.pick=function(b){pick(+b.dataset.k)};

 A.submit=submit;A.cont=cont;A.next=newRound;A.reset=reset;

  {grading:gradingModal,reset:function(){closeModal();reset()},apply:function(){closeModal();if(state==='q')nextQ()}},
  function(ov){ov.addEventListener('change',function(e){var t=e.target;if(t.id==='m-types')sl.learnTypes=t.value;if(t.id==='m-dir')sl.dir=t.value;if(t.id==='m-star'){sl.starredOnly=t.checked;cards=studyCards(s,sl);roundNo=0;newRound()}SLsave(s.id,sl)})})};

function viewTest(s){
 var sl=SL(s.id),cards=studyCards(s,sl),qs=[],done=false;
 if(!cards.length)return tooFew(s,1,'Test');

  '<div class="srow"><span>True / False</span>'+togHTML('t-tf',cfg.tf)+'</div><div class="srow"><span>Multiple choice</span>'+togHTML('t-mc',cfg.mc)+'</div><div class="srow"><span>Written</span>'+togHTML('t-w',cfg.w)+'</div>'+

 A.start=function(){cfg={n:Math.max(1,Math.min(cards.length,+$('#t-n').value||1)),dir:$('#t-dir').value,tf:$('#t-tf').checked,mc:$('#t-mc').checked,w:$('#t-w').checked};

  sl.testCfg=cfg;SLsave(s.id,sl);

 function qBody(o,k){

  if(o.type==='mc')return '<div class="qsub">Choose the matching '+o.q.aLabel.toLowerCase()+'</div><div class="opts">'+o.opts.map(function(x,j){var cls='';if(done){if(x===o.q.a)cls=' right';else if(o.user===j)cls=' wrong';else cls=' dim'}else if(o.user===j)cls=' sel';return '<button class="opt'+cls+'" data-a="tpick" data-q="'+k+'" data-k="'+j+'"'+(done?' disabled':'')+'><span class="num">'+(j+1)+'</span><span>'+esc(x)+'</span></button>'}).join('')+'</div>';
  var tf=function(v,l){var cls='';if(done){if(v===o.truth)cls=' right';else if(o.user===v)cls=' wrong';else cls=' dim'}else if(o.user===v)cls=' sel';return '<button class="opt'+cls+'" data-a="ttf" data-q="'+k+'" data-v="'+(v?1:0)+'"'+(done?' disabled':'')+'>'+l+'</button>'};
  return '<div class="tf-shown"><div class="qlabel">'+o.q.aLabel+'</div><div class="qtext xs">'+esc(o.shown)+'</div></div><div class="opts">'+tf(true,'True')+tf(false,'False')+'</div>';
 }
 function qHTML(o,k){return '<div class="qcard tq'+(done?(o.ok?' res-ok':' res-no'):'')+'" id="tq'+k+'"><div class="row-between"><span class="qlabel">'+o.q.qLabel+'</span><span>'+(done?'<span class="tag '+(o.ok?'ok':'no')+'">'+(o.ok?'CORRECT':'INCORRECT')+'</span> ':'')+'<span class="muted xs">'+(k+1)+' of '+qs.length+'</span></span></div><div class="qtext sm">'+esc(o.q.q)+'</div>'+qBody(o,k)+'</div>'}
 function scoreHTML(){var r=qs.filter(function(o){return o.ok}).length;return '<div class="qcard" id="score"><div class="score">'+ring(r/qs.length)+'<div><h2 style="margin:0 0 6px">'+(r===qs.length?'Perfect score!':r/qs.length>=.8?'Great job!':r/qs.length>=.5?'Keep it up!':'You\'re still learning — keep going!')+'</h2><div class="muted"><b style="color:var(--good)">'+r+' correct</b> · <b style="color:var(--bad)">'+(qs.length-r)+' incorrect</b></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary sm" data-a="retake">Retake test</button><button class="btn sm" data-a="newtest">New test</button><button class="btn sm" data-a="close">Back to set</button></div></div></div></div>'}

 A.ttf=function(b){var o=qs[+b.dataset.q];o.user=b.dataset.v==='1';$$('.opt',b.parentNode).forEach(function(x){x.classList.toggle('sel',x===b)})};
 A._input=function(e){var k=e.target.dataset.q;if(k!=null&&e.target.classList.contains('ans'))qs[+k].user=e.target.value};
 viewKey=function(e){if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ans')&&!done){e.preventDefault();var k=+e.target.dataset.q;var nx=$$('#app input.ans').filter(function(x){return +x.dataset.q>k})[0];if(nx){nx.focus();nx.scrollIntoView({block:'center',behavior:'smooth'})}else A.submit()}};
 function gradeAll(){var p=P();qs.forEach(function(o){if(o.type==='w'){o.g=grade(o.user||'',o.q.a,p);o.ok=o.g.ok}else if(o.type==='mc')o.ok=o.user!=null&&o.opts[o.user]===o.q.a;else o.ok=o.user===o.truth});done=true;drawTest();window.scrollTo(0,0)}

 A.retake=function(){qs.forEach(function(o){o.user=null;o.ok=false;o.g=null});qs=shuffle(qs);done=false;drawTest()};
 A.newtest=setup;
 setup();

/* ---------- match ---------- */
function viewMatch(s){
 var sl=SL(s.id),cards=studyCards(s,sl),tiles=[],sel=null,t0=0,pen=0,left=0,iv=null,fin=false;
 if(cards.length<2)return tooFew(s,2,'Match');
 var fmt=function(ms){return(ms/1000).toFixed(1)+'s'};
 A.close=function(){go('set-'+s.id)};
 function intro(){app.innerHTML=studyTop(s,'Match')+'<main class="wrap narrow"><div class="qcard center"><h2>Ready to play?</h2><p class="muted">Match all the terms with their definitions as fast as you can.<br>Avoid wrong matches — they add 1 second to your time.</p>'+(sl.matchBest?'<p>Your best: <b>'+fmt(sl.matchBest)+'</b></p>':'')+'<button class="btn primary big" data-a="start">Start game</button></div></main>'}
 A.start=function(){var pick=shuffle(cards).slice(0,6);tiles=shuffle([].concat.apply([],pick.map(function(c){return[{id:c.id,txt:c.t,k:'t'},{id:c.id,txt:c.d,k:'d'}]})));sel=null;pen=0;left=pick.length;fin=false;t0=performance.now();
  app.innerHTML=studyTop(s,'Match','<span id="clock">0.0s</span>')+'<main class="wrap"><div class="mgrid">'+tiles.map(function(t,k){return '<button class="mtile" data-a="tile" data-k="'+k+'">'+esc(t.txt)+'</button>'}).join('')+'</div></main>';
  clearInterval(iv);iv=setInterval(function(){var c=$('#clock');if(c)c.textContent=fmt(performance.now()-t0+pen)},100);timers.push(iv)};
 A.tile=function(b){if(fin)return;var k=+b.dataset.k,t=tiles[k];if(t.done)return;
  if(sel===null){sel=k;b.classList.add('sel');return}
  if(sel===k){sel=null;b.classList.remove('sel');return}
  var a=tiles[sel],ab=$('.mtile[data-k="'+sel+'"]');sel=null;ab.classList.remove('sel');
  if(a.id===t.id&&a.k!==t.k){a.done=t.done=true;[ab,b].forEach(function(x){x.classList.add('ok');setTimeout(function(){x.classList.add('gone')},220)});left--;if(!left)setTimeout(finish,350)}
  else{pen+=1000;[ab,b].forEach(function(x){x.classList.add('bad');setTimeout(function(){x.classList.remove('bad')},450)})}
 };
 function finish(){fin=true;clearInterval(iv);var t=performance.now()-t0+pen,best=sl.matchBest,nb=!best||t<best;if(nb){sl.matchBest=t;SLsave(s.id,sl)}
  app.innerHTML=studyTop(s,'Match')+'<main class="wrap narrow"><div class="qcard center"><h2>'+(nb?'New personal best!':'Nice work!')+'</h2><p style="font-size:40px;font-weight:900;margin:10px 0">'+fmt(t)+'</p><p class="muted">'+(pen?'Includes '+(pen/1000)+'s penalty · ':'')+'Best: '+fmt(sl.matchBest)+'</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn primary" data-a="start">Play again</button><button class="btn" data-a="close">Back to set</button></div></div></main>'}
 intro();
}

/* ================= multiple-choice quiz ================= */
var LET='ABCDEF';
function blankQ(){return{id:uid(),p:'',q:'',opts:['','','',''],ans:-1,why:''}}
function qPrefs(id){var o=ls.get('fc_q_'+id,{});return{shufQ:o.shufQ!==undefined?o.shufQ:false,shufO:!!o.shufO,last:o.last||null,best:o.best!=null?o.best:null}}
/* paste format:  1. Question?  /  A. option  /  B) option  /  Answer: B  /  Explanation: ... ; or mark the right option with * */
function parseQuiz(text){var out=[],cur=null,inP=false;
 var NUM=/^(?:Q\s*)?\d+\s*[\.\)、:：]\s*(.+)$/i,QL=/^(?:question|q)\s*[:：]\s*(.+)$/i;
 String(text).replace(/\r\n?/g,'\n').split('\n').forEach(function(line){var l=line.trim(),m;if(!l)return;
  if((m=l.match(/^(?:passage|text|reading)\s*[:：]\s*(.*)$/i))){cur={id:uid(),p:m[1],q:'',opts:[],ans:-1,why:''};out.push(cur);inP=true;return}
  if(inP){if((m=l.match(QL))||(m=l.match(NUM))){cur.q=m[1];inP=false}else cur.p+=(cur.p?'\n':'')+l;return}

  var fb='';
  if(rv){var ok=isRight(id),cl=LET[st.co[id].indexOf(q.ans)];
   fb='<div class="sfb '+(ok?'ok':'no')+'"><span class="sfi">'+(ok?'✓':'✕')+'</span>'+(ok?'Correct!':sel==null?'Not answered. The answer is '+cl+'.':'Not quite. The answer is '+cl+'.')+'</div>'+(q.why?'<div class="sexp"><div class="sexp-h">EXPLANATION</div>'+esc(q.why)+'</div>':'')}
  else if(st.mode==='check')fb='<div class="scheck"><button class="sbtn-p" data-a="check"'+(sel==null?' disabled':'')+'>Check answer</button><span class="shint">'+(sel==null?'Pick an answer, then check it.':'Press Enter to check.')+'</span></div>';
  var nextLbl=last?(st.done?'Results':(st.mode==='test'?'Finish':'See results')):'Next';
  return header()+'<main class="smain'+(P.p?'':' single')+'">'+(P.p?'<section class="spass">'+fmtPassage(P.p)+'</section><div class="sdiv"></div>':'')+
   '<section class="sq"><div class="sq-top"><span class="sqn">'+(i+1)+'</span><button class="smark'+(mk?' on':'')+'" data-a="mark">'+FLAG+'Mark for Review</button><div class="sp"></div>'+(rv?'':'<button class="sabc'+(abc?' on':'')+'" data-a="abc" title="Answer eliminator — cross out choices">ABC</button>')+'</div>'+
   (P.src?'<div class="ssrc">From '+esc(srcLabel(P.src))+'</div>':'')+'<div class="sq-line"></div>'+
   '<div class="sq-q">'+esc(P.q)+'</div><div class="sopts">'+opts+'</div>'+fb+'</section></main>'+
   '<footer class="sf"><button class="sbtn" data-a="back"'+(i?'':' disabled')+'>Back</button><button class="snav" data-a="nav">Question <b>'+(i+1)+'</b> of <b>'+N+'</b> <span class="car">▴</span></button><button class="sbtn-p" data-a="next">'+nextLbl+'</button></footer>'}
 function resultsView(){var r=st.order.filter(isRight).length,pc=Math.round(r/N*100),wrong=N-r;
  return header()+'<main class="sres"><div class="sres-card"><div class="sres-top"><div><div class="sres-lbl">YOUR SCORE</div><div class="sres-big">'+r+'<span> / '+N+'</span></div><div class="sres-sub">'+pc+'% correct · '+fmtTime(st.el)+' · '+(st.mode==='test'?'Test mode':'Check each question')+(st.sub?' · missed questions':'')+'</div></div>'+
  '<div class="sres-ring" style="background:conic-gradient(#1f7a44 '+pc+'%,#e3e6ee 0)"><b>'+pc+'%</b></div></div>'+
  '<div class="slegend"><span><i class="lg-ok"></i>Correct '+r+'</span><span><i class="lg-no"></i>Wrong or blank '+wrong+'</span><span><i class="lg-mk"></i>Marked for review</span><span class="muted-l">Click a number to review it</span></div>'+
  '<div class="sgrid">'+st.order.map(function(id,k){return '<button class="scell '+(isRight(id)?'ok':'no')+(st.mark[id]?' mk':'')+'" data-a="goto" data-k="'+k+'">'+(k+1)+'</button>'}).join('')+'</div>'+
  '<div class="sres-btns"><button class="sbtn-p" data-a="review">Review answers</button>'+(wrong?'<button class="sbtn" data-a="missed">Retake missed ('+wrong+')</button>':'')+'<button class="sbtn" data-a="retry">Retake (new shuffle)</button><button class="sbtn" data-a="exit">Back to quiz</button></div></div></main>'}
 function navOverlay(){var na=nAns();
  return '<div class="sov" data-a="ovbg"><div class="smod"><div class="smod-h"><b>Question navigator</b><button class="slink" data-a="close">Close</button></div>'+
  '<div class="slegend"><span><i class="lg-un"></i>Unanswered</span><span><i class="lg-ans"></i>Answered</span><span><i class="lg-ok"></i>Correct</span><span><i class="lg-no"></i>Wrong</span><span><i class="lg-mk"></i>Marked for review</span></div>'+
  '<div class="sgrid">'+st.order.map(function(id,k){var c='';if(revealed(id))c=isRight(id)?' ok':' no';else if(st.ans[id]!=null)c=' ans';return '<button class="scell'+c+(k===st.cur?' cur':'')+(st.mark[id]?' mk':'')+'" data-a="goto" data-k="'+k+'">'+(k+1)+'</button>'}).join('')+'</div>'+
  '<div class="smod-f"><span>'+(st.done?'Reviewing your finished set':na+' answered · '+(N-na)+' unanswered'+(N-na?' (scored as wrong if you finish now)':''))+'</span>'+(st.done?'<button class="sbtn-p" data-a="results">See results</button>':'<button class="sbtn-p" data-a="finish">Finish and see score</button>')+'</div></div></div>'}
 function modeOverlay(){return '<div class="sov" data-a="ovbg"><div class="smod narrow"><div class="smod-h"><b>Answer mode</b><button class="slink" data-a="close">Close</button></div>'+
  '<label class="smode'+(st.mode==='check'?' on':'')+'" data-a="setmode" data-m3="check"><input type="radio" name="smd"'+(st.mode==='check'?' checked':'')+'><div><b>Check each question</b><span>Lock in an answer to see if it\'s right and read the explanation right away.</span></div></label>'+
  '<label class="smode'+(st.mode==='test'?' on':'')+'" data-a="setmode" data-m3="test"><input type="radio" name="smd"'+(st.mode==='test'?' checked':'')+'><div><b>Test mode</b><span>No feedback until you finish. Change answers freely, then score the whole set.</span></div></label>'+
  '<div class="skeys"><div class="sexp-h">KEYBOARD</div>A–D or 1–4 pick a choice · Enter checks or moves on · ← → move between questions · M marks for review</div></div></div>'}
 function confirmOverlay(title,text,okLbl,act){return '<div class="sov" data-a="ovbg"><div class="smod narrow"><div class="smod-h"><b>'+esc(title)+'</b><button class="slink" data-a="close">Close</button></div><p class="sp-text">'+esc(text)+'</p><div class="sres-btns"><button class="sbtn-p" data-a="'+act+'">'+esc(okLbl)+'</button><button class="sbtn" data-a="close">Keep going</button></div></div></div>'}
 function draw(){document.body.classList.toggle('sat-dark',dark);app.innerHTML='<div class="sat'+(dark?' dark':'')+'">'+(view==='results'?resultsView():qView())+(overlay||'')+'</div>'}
 function go2(i){if(i<0||i>=N)return;st.cur=i;view='q';overlay=null;save();draw();window.scrollTo(0,0)}
 function finish(){if(!st.done){st.el=elapsed();st.done=true;
   if(!st.sub){var r=st.order.filter(isRight).length,qp=qPrefs(s.id);qp.last={score:r,total:N,date:Date.now()};qp.best=Math.max(qp.best||0,Math.round(r/N*100));ls.set('fc_q_'+s.id,qp)}}
  view='results';overlay=null;save(true);draw();window.scrollTo(0,0)}
 function restart(subset,force){st=fresh(st.mode,subset,force);N=st.order.length;base=0;t0=Date.now();view='q';overlay=null;abc=false;save(true);draw();window.scrollTo(0,0)}
 function pick(j){var id=st.order[st.cur];if(revealed(id)||view!=='q')return;st.ans[id]=j;if(st.elim[id])delete st.elim[id][j];save();draw()}
 function check(){var id=st.order[st.cur];if(st.mode!=='check'||st.ans[id]==null||st.chk[id]||st.done)return;st.chk[id]=1;save();draw()}
 function next(){if(st.cur<N-1)return go2(st.cur+1);if(st.done){view='results';return draw()}
  var un=N-nAns();if(st.mode==='test'&&un){overlay=confirmOverlay('Finish the test?','You have '+un+' unanswered question'+(un>1?'s':'')+'. They\'ll be scored as wrong.','Finish and see score','finish');return draw()}finish()}
 A.exit=function(){save(true);go('quiz-'+s.id)};
 A.hidet=function(){st.hide=!st.hide;save();draw()};
 A.dark=function(){dark=!dark;ls.set('fc_sat_dark',dark);draw()};
 A.mode=function(){overlay=modeOverlay();draw()};
 A.setmode=function(b,e){e.preventDefault();st.mode=b.dataset.m3;overlay=null;save();draw()};
 A.shuf=function(){overlay=confirmOverlay('Start a new shuffle?','All '+all.length+' questions come back in a new order with new choice orders. Your current answers are cleared.','Shuffle all '+all.length,'doshuf');draw()};
 A.doshuf=function(){restart(null,true)};
 A.close=function(){overlay=null;draw()};
 A.ovbg=function(b,e){if(e.target===b){overlay=null;draw()}};
 A.nav=function(){overlay=navOverlay();draw()};
 A.goto=function(b){go2(+b.dataset.k)};
 A.finish=function(){finish()};
 A.results=function(){view='results';overlay=null;draw();window.scrollTo(0,0)};
 A.pick=function(b){pick(+b.dataset.j)};
 A.elim=function(b){var id=st.order[st.cur],j=+b.dataset.j;st.elim[id]=st.elim[id]||{};if(st.elim[id][j])delete st.elim[id][j];else{st.elim[id][j]=1;if(st.ans[id]===j)delete st.ans[id]}save();draw()};
 A.abc=function(){abc=!abc;draw()};
 A.mark=function(){var id=st.order[st.cur];if(st.mark[id])delete st.mark[id];else st.mark[id]=1;save();draw()};
 A.check=check;A.next=next;A.back=function(){go2(st.cur-1)};
 A.review=function(){go2(0)};A.retry=function(){restart(null,true)};
 A.missed=function(){restart(st.order.filter(function(id){return !isRight(id)}),false)};
 viewKey=function(e){var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(overlay){if(e.key==='Escape'){overlay=null;draw()}return}
  if(view!=='q'){if(e.key==='Enter'&&st.done){e.preventDefault();go2(0)}return}
  var k=e.key.toLowerCase(),id=st.order[st.cur],n=byId[id].opts.length,idx='abcdef'.indexOf(k);if(idx<0&&/^[1-6]$/.test(k))idx=+k-1;
  if(idx>=0&&idx<n){e.preventDefault();pick(st.co[id][idx])}
  else if(e.key==='Enter'){e.preventDefault();if(st.mode==='check'&&!revealed(id)&&st.ans[id]!=null)check();else next()}
  else if(e.key==='ArrowRight'){e.preventDefault();if(st.cur<N-1)go2(st.cur+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go2(st.cur-1)}
  else if(k==='m'){e.preventDefault();A.mark()}};
 timers.push(setInterval(function(){var t=$('#sat-time');if(t&&!st.hide&&!st.done)t.textContent=fmtTime(elapsed())},1000));
 timers.push(setInterval(function(){if(!st.done)save(true)},20000));
 draw();
}

render();bootFirebase();
})();
</script>
</body>
</html>
